name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compilar
        run: python -m py_compile lanchat.py
      - name: Pruebas (servidores reales en 127.0.0.1)
        run: python -m unittest discover -s tests -v

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck del lanzador
        run: shellcheck lan_chat.sh
      - name: El lanzador arranca
        run: ./lan_chat.sh --help
